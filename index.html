<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Cadastro de Aluno</h1>

        <form id="formAluno">
            <div class="form-group">
                <label for="nome_completo">Nome Completo</label>
                <input type="text" id="nome_completo" required>
            </div>

            <div class="form-group">
                <label for="usuario_acesso">Usuário de Acesso</label>
                <input type="text" id="usuario_acesso" required>
            </div>

            <div class="form-group">
                <label for="senha_hash">Senha</label>
                <input type="password" id="senha_hash" required>
            </div>

            <div class="form-group">
                <label for="email_aluno">E-mail</label>
                <input type="email" id="email_aluno" required>
            </div>

            <div class="form-group">
                <label for="observacao">Observação</label>
                <textarea id="observacao" rows="3"></textarea>
            </div>

            <button type="submit">Cadastrar Aluno</button>
            <div id="mensagem" class="mensagem"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
